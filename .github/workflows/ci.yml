name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare PNPM
        run: corepack prepare pnpm@9.1.0 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm -w build

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      - name: Test
        env:
          CI: true
        run: pnpm -w test

      - name: Coverage (core + ui thresholds)
        env:
          CI: true
        run: pnpm -w test:coverage


