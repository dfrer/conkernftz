# Foundry config for the EVM contracts. The committed TS artifacts (src/*-artifact.ts) are the
# runtime source for viem deploys; Foundry is the test/audit toolchain only. Dependencies resolve
# from the pnpm node_modules tree (see remappings.txt); forge-std is installed into lib/ in CI via
# `forge install foundry-rs/forge-std`.
[profile.default]
src = "contracts"
out = "out"
test = "test"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.31"
# No filesystem access needed by the tests; keep cheatcode FS permissions off.
fs_permissions = []

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 32
# Invariants must hold across both reverting and successful handler calls; we assert reverts
# explicitly in the handler where relevant, so don't discard reverting sequences.
fail_on_revert = false
